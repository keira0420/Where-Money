services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_DATABASE: where_money
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./Where-Money-Backend
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/where_money?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      AI_API_KEY: ${AI_API_KEY:-not-configured}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: [127.0.0.1:5050:5050]
  frontend:
    build: ./Where-Money-Frontend
    depends_on: [backend]
    ports: [127.0.0.1:13140:80]
volumes:
  mysql-data:
  redis-data:
