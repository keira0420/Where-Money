# 数据库连接配置
# 连接到MySQL数据库，包含主机、端口、数据库名和各种参数
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/where_money?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
# 数据库用户名
spring.datasource.username=${MYSQL_USER:root}
# 数据库密码（加密存储）
spring.datasource.password=${MYSQL_PASSWORD:}
# MySQL驱动类名
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hikari连接池最大生命周期（毫秒）
spring.datasource.hikari.max-lifetime=500000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# Jackson配置
# 日期格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
# 时区设置
spring.jackson.time-zone=GMT+8

# 文件上传配置
# 最大文件大小
spring.servlet.multipart.max-file-size=10MB
# 最大请求大小
spring.servlet.multipart.max-request-size=12MB

# Redis配置
# Redis主机地址
spring.data.redis.host=localhost
# Redis端口
spring.data.redis.port=6379
# Jedis连接池最大等待时间（毫秒）
spring.data.redis.jedis.pool.max-wait=30000
# Jedis连接池最大活跃连接数
spring.data.redis.jedis.pool.max-active=100
# Jedis连接池最大空闲连接数
spring.data.redis.jedis.pool.max-idle=20
# Jedis连接池最小空闲连接数
spring.data.redis.jedis.pool.min-idle=0
# Redis连接超时时间（毫秒）
spring.data.redis.timeout=3000

# MyBatis配置
# 下划线转驼峰命名映射
mybatis.configuration.map-underscore-to-camel-case=true
# Mapper文件位置
mybatis.mapper-locations=classpath:mapper/*.xml

# SQL初始化配置
# 初始化模式（always：总是初始化）
spring.sql.init.mode=always
# Schema文件位置
spring.sql.init.schema-locations=classpath:schema.sql,classpath:indexes.sql

# 服务器配置
# 服务器端口
server.port=5050
# MVC路径匹配策略
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# Token配置
# Token私钥
token.privateKey=${JWT_SECRET:}
# 年轻Token过期时间（毫秒）
token.youngToken=1000000
# 老Token过期时间（毫秒）
token.oldToken=3000000000

# Redis缓存过期时间配置（天）
# 账单分类缓存过期时间
redis.billCategory.expire=7
# 资产缓存过期时间
redis.asset.expire=7
# 账单缓存过期时间
redis.bill.expire=7

# Jasypt加密配置
# 加密密码
jasypt.encryptor.password=${JASYPT_PASSWORD:not-configured}
# 加密算法
jasypt.encryptor.algorithm=PBEWITHMD5ANDDES
# 加密器Bean名
jasypt.encryptor.bean=jasyptComputer

# 默认SVG图标配置
# 默认钱包图标
default.svg=ic:baseline-account-balance-wallet
spring.ai.openai.api-key=${AI_API_KEY:not-configured}
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode
spring.ai.openai.chat.options.model=qwen3.5-plus
spring.ai.openai.chat.options.temperature=0.1
ai.bill.parse.limit-per-minute=5
ai.bill.parse.timeout-ms=20000
spring.ai.retry.max-attempts=1
ai.bill.max-concurrent=8
ai.report.cache-seconds=300
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=20s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.pattern.level=%5p [request:%X{requestId:-}]
