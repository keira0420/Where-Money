name: verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: integration-password}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pintegration-password" --health-interval=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    env:
      TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/where_money_ai_test?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
      TEST_MYSQL_PASSWORD: integration-password
      TEST_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: bash mvnw -B -Dintegration=true verify
        working-directory: Where-Money-Backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: Where-Money-Frontend/package-lock.json}
      - run: npm ci --ignore-scripts && npm run typecheck && npm run build
        working-directory: Where-Money-Frontend
